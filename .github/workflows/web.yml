name: web

# The browser console in web/ (decision 0013). It runs when the console, the
# protocol examples it tests against, or the protocol document change.
on:
  push:
    paths:
      - "web/**"
      - "internal/gwapi/testdata/**"
      - "docs/gateway-protocol.md"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "web/**"
      - "internal/gwapi/testdata/**"
      - "docs/gateway-protocol.md"
      - ".github/workflows/web.yml"

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24.11.1"

defaults:
  run:
    working-directory: web

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      # The pnpm version comes from "packageManager" in web/package.json.
      - uses: pnpm/action-setup@v6.1.1
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: install
        run: pnpm install --frozen-lockfile
      - name: type check
        run: pnpm typecheck
      - name: lint
        run: pnpm lint
      # Includes the round trip of every example in internal/gwapi/testdata.
      - name: unit and component tests
        run: pnpm test
      - name: build
        run: pnpm build

      - name: playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: cache the browser
        id: browser-cache
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: install the browser
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: install the browser system libraries
        if: steps.browser-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      # End-to-end and accessibility (axe) tests against the fake gateway.
      - name: end-to-end tests
        run: pnpm e2e
      - name: keep the report of a failed run
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7
