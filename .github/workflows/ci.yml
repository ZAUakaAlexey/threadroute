name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.27.4"
  GOTOOLCHAIN: go1.27.4

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum
      - name: go vet
        run: go vet ./... && go vet -tags integration ./...
      # Regenerates the sqlc code with the pinned version and fails when the
      # result differs from the committed files, new files included.
      - name: generated code is up to date
        run: |
          make generate
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            git diff
            echo "generated code is out of date: run make generate and commit the result"
            exit 1
          fi
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.15.0
      - name: unit tests
        run: go test -race -count=1 ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...

  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum
      # -p 1: one package at a time, each starts its own containers.
      - name: integration tests (real Kafka, Redis and PostgreSQL via Testcontainers)
        run: >
          go test -race -count=1 -p 1 -tags integration
          ./internal/bus/... ./internal/normalize/... ./internal/conv/... ./internal/pg/... ./internal/router/...
          ./internal/sim/...

  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.4.1
      # Interpolates the defaults, so a missing variable default or a broken
      # service entry fails here.
      - name: compose file is valid
        run: docker compose -f deploy/compose.yaml config -q
      - name: build the service images
        run: |
          for cmd in ingest normalize conv router sim; do
            docker buildx build --load -f deploy/Dockerfile \
              --build-arg CMD=$cmd -t threadroute-$cmd:${{ github.sha }} .
          done
