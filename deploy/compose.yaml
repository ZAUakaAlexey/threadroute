# Local development stack: Kafka, Redis, PostgreSQL, ingest, normalize,
# conv, router, sim and (optional) record.
#
#   docker compose -f deploy/compose.yaml up -d --build            # the pipeline
#   docker compose -f deploy/compose.yaml --profile record up -d   # also record
#
# Start order: ingest creates raw.bluesky and ingest.cursor, normalize waits
# for raw.bluesky and creates events and events.control, conv waits for those
# two and creates conversations. The router waits for PostgreSQL (healthy)
# and for conversations, and creates routing. sim waits for the operator API
# of the router and for routing. Each service waits a bounded time (2
# minutes by default, 1 minute for PostgreSQL) and then exits, and the
# restart policy starts it again, so a cold start needs no manual steps.
#
# Every published port listens on 127.0.0.1 only. The only secret is the
# PostgreSQL password. Its default here is for this local stack only; set
# THREADROUTE_POSTGRES_PASSWORD in .env for anything else. Redis has no
# password and is reachable from the host only.

name: threadroute

x-go-service: &go-service
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  restart: unless-stopped
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  depends_on:
    kafka:
      condition: service_healthy

services:
  kafka:
    image: apache/kafka:4.4.0
    hostname: kafka
    restart: unless-stopped
    environment:
      # KRaft combined mode: broker and controller in one process (decision 0001).
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # INTERNAL is for containers in this stack, HOST for tools on the host.
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,HOST://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,HOST://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # One node, so every internal topic has one replica.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      # Services create their topics with explicit configs (EnsureTopics).
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # The broker heap is capped at 512 MB (decision 0001).
      KAFKA_HEAP_OPTS: -Xmx512m -Xms512m
    ports:
      - "127.0.0.1:9094:9094"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 15s
      retries: 12
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1g

  # Deduplication keys of normalize, and conversation state, outboxes and
  # applied-event markers of conv. normalize needs Redis 7.0 or newer.
  redis:
    image: redis:7.4.7-alpine
    hostname: redis
    restart: unless-stopped
    # The uid and gid of the redis user in the image. The entrypoint then
    # skips its chown and user switch, which would need capabilities.
    user: "999:1000"
    command:
      - redis-server
      # Below the container limit, so a full Redis refuses writes with an
      # error before the kernel kills it. noeviction: a silently evicted
      # dedup key, applied marker or conversation key would break
      # deduplication and conversation state, so Redis must refuse writes
      # instead. normalize and conv stop on a Redis error.
      # The 2026-11-24 run grew by about 35 MiB per hour, and most keys
      # live 7 to 8 hours, so about 250 MiB is expected after 8 hours of
      # quiet traffic. 768mb leaves room for busier hours and bursts.
      - --maxmemory
      - 768mb
      - --maxmemory-policy
      - noeviction
      # Append-only file, written and synced on every write. conv commits
      # its Kafka offsets only after Redis confirmed a write, so a confirmed
      # write must survive a restart: the conversation state and the outbox
      # come back after a Redis restart.
      - --appendonly
      - "yes"
      - --appendfsync
      - always
      # Redis holds post text. A deletion removes it from memory at once,
      # but the old text stays in the append-only file until the next
      # rewrite (decision 0004). The file is rewritten when it has grown by
      # half since the last rewrite, and not before it reaches 32 MB.
      - --auto-aof-rewrite-percentage
      - "50"
      - --auto-aof-rewrite-min-size
      - 32mb
      # No separate RDB snapshots.
      - --save
      - ""
    ports:
      - "127.0.0.1:${THREADROUTE_REDIS_HOST_PORT:-6379}:6379"
    volumes:
      # /data of the image, owned by the redis user (999:1000). The
      # append-only files are in /data/appendonlydir.
      - redis-data:/data
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    deploy:
      resources:
        limits:
          # maxmemory plus room for the process itself.
          memory: 1g

  # Routing state of the router: operators, conversations, offers, teams,
  # SLA timers and the outbox of routing events. No post text (decision 0004).
  postgres:
    image: postgres:19.0-alpine
    hostname: postgres
    restart: unless-stopped
    # The uid and gid of the postgres user in the image. The entrypoint then
    # skips its chown and user switch, which would need capabilities.
    user: "70:70"
    environment:
      POSTGRES_USER: threadroute
      POSTGRES_DB: threadroute
      # Local only. The default is not a secret and must not be used
      # anywhere else. Only URL-safe characters, because it is also put
      # into the DSN of the router below.
      POSTGRES_PASSWORD: ${THREADROUTE_POSTGRES_PASSWORD:-threadroute-local-only}
    ports:
      - "127.0.0.1:${THREADROUTE_POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      # The image keeps its data in /var/lib/postgresql/19/docker (PGDATA).
      - postgres-data:/var/lib/postgresql
    read_only: true
    tmpfs:
      - /var/run/postgresql
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Over TCP: the temporary server of the first start listens on the
    # socket only, so it does not count as ready.
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "threadroute", "-d", "threadroute"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          # shared_buffers is 128 MB by default; the router uses at most 8
          # connections.
          memory: 512m

  ingest:
    <<: *go-service
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        CMD: ingest
    image: threadroute-ingest:dev
    environment:
      THREADROUTE_KAFKA_BROKERS: kafka:9092
      THREADROUTE_SOURCE_PRIMARY_HOST: ${THREADROUTE_SOURCE_PRIMARY_HOST:-jetstream.us-east.bsky.network}
      THREADROUTE_SOURCE_FAILOVER_HOST: ${THREADROUTE_SOURCE_FAILOVER_HOST:-jetstream.us-west.bsky.network}
      THREADROUTE_SOURCE_COLLECTION: ${THREADROUTE_SOURCE_COLLECTION:-app.bsky.feed.post}
      THREADROUTE_METRICS_ADDR: ":9464"
      THREADROUTE_LOG_LEVEL: ${THREADROUTE_LOG_LEVEL:-info}
      THREADROUTE_PRODUCER_MAX_BUFFERED_RECORDS: ${THREADROUTE_PRODUCER_MAX_BUFFERED_RECORDS:-10000}
      THREADROUTE_PRODUCER_MAX_BUFFERED_BYTES: ${THREADROUTE_PRODUCER_MAX_BUFFERED_BYTES:-33554432}
      THREADROUTE_PRODUCER_DELIVERY_TIMEOUT: ${THREADROUTE_PRODUCER_DELIVERY_TIMEOUT:-2m}
      THREADROUTE_RAW_RETENTION: ${THREADROUTE_RAW_RETENTION:-24h}
      THREADROUTE_RAW_MAX_BYTES: ${THREADROUTE_RAW_MAX_BYTES:-8000000000}
    ports:
      - "127.0.0.1:9464:9464"
    # Ingest lets the current batch finish (up to 10s) and then flushes the
    # producer (up to 10s) before it exits.
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 256m

  normalize:
    <<: *go-service
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        CMD: normalize
    image: threadroute-normalize:dev
    # The anchor merge is shallow, so the whole list is repeated here.
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      THREADROUTE_KAFKA_BROKERS: kafka:9092
      THREADROUTE_LOG_LEVEL: ${THREADROUTE_LOG_LEVEL:-info}
      THREADROUTE_REDIS_ADDR: redis:6379
      THREADROUTE_REDIS_PASSWORD: ${THREADROUTE_REDIS_PASSWORD:-}
      THREADROUTE_REDIS_DB: ${THREADROUTE_REDIS_DB:-0}
      THREADROUTE_NORMALIZE_GROUP_ID: ${THREADROUTE_NORMALIZE_GROUP_ID:-threadroute-normalize}
      THREADROUTE_NORMALIZE_TRANSACTIONAL_ID: ${THREADROUTE_NORMALIZE_TRANSACTIONAL_ID:-threadroute-normalize}
      THREADROUTE_NORMALIZE_START: ${THREADROUTE_NORMALIZE_START:-beginning}
      THREADROUTE_NORMALIZE_MAX_BATCH_RECORDS: ${THREADROUTE_NORMALIZE_MAX_BATCH_RECORDS:-1000}
      THREADROUTE_NORMALIZE_DEDUP_KEY_LIFETIME: ${THREADROUTE_NORMALIZE_DEDUP_KEY_LIFETIME:-10m}
      THREADROUTE_NORMALIZE_RAW_TOPIC_WAIT: ${THREADROUTE_NORMALIZE_RAW_TOPIC_WAIT:-2m}
      THREADROUTE_NORMALIZE_METRICS_ADDR: ":9466"
      THREADROUTE_NORMALIZE_PRODUCER_MAX_BUFFERED_RECORDS: ${THREADROUTE_NORMALIZE_PRODUCER_MAX_BUFFERED_RECORDS:-10000}
      THREADROUTE_NORMALIZE_PRODUCER_MAX_BUFFERED_BYTES: ${THREADROUTE_NORMALIZE_PRODUCER_MAX_BUFFERED_BYTES:-33554432}
      THREADROUTE_NORMALIZE_PRODUCER_DELIVERY_TIMEOUT: ${THREADROUTE_NORMALIZE_PRODUCER_DELIVERY_TIMEOUT:-2m}
    ports:
      - "127.0.0.1:9466:9466"
    # A batch in progress gets 10s to commit and the end of the transaction
    # up to 15s more (internal/normalize).
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 256m

  conv:
    <<: *go-service
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        CMD: conv
    image: threadroute-conv:dev
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      THREADROUTE_KAFKA_BROKERS: kafka:9092
      THREADROUTE_LOG_LEVEL: ${THREADROUTE_LOG_LEVEL:-info}
      THREADROUTE_REDIS_ADDR: redis:6379
      THREADROUTE_REDIS_PASSWORD: ${THREADROUTE_REDIS_PASSWORD:-}
      THREADROUTE_REDIS_DB: ${THREADROUTE_REDIS_DB:-0}
      THREADROUTE_CONV_GROUP_ID: ${THREADROUTE_CONV_GROUP_ID:-threadroute-conv}
      THREADROUTE_CONV_METRICS_ADDR: ":9467"
      THREADROUTE_CONV_SWEEP_INTERVAL: ${THREADROUTE_CONV_SWEEP_INTERVAL:-1s}
      THREADROUTE_CONV_INPUT_TOPIC_WAIT: ${THREADROUTE_CONV_INPUT_TOPIC_WAIT:-2m}
      THREADROUTE_CONV_ADMISSION_THRESHOLD: ${THREADROUTE_CONV_ADMISSION_THRESHOLD:-10}
      THREADROUTE_CONV_ADMISSION_WINDOW: ${THREADROUTE_CONV_ADMISSION_WINDOW:-1h}
      THREADROUTE_CONV_ADMISSION_IDLE: ${THREADROUTE_CONV_ADMISSION_IDLE:-2h}
      THREADROUTE_CONV_COMPANY_LIMIT: ${THREADROUTE_CONV_COMPANY_LIMIT:-0}
      THREADROUTE_CONV_INACTIVITY_TIMEOUT: ${THREADROUTE_CONV_INACTIVITY_TIMEOUT:-30m}
      THREADROUTE_CONV_TEXT_KEPT_AFTER_CLOSE: ${THREADROUTE_CONV_TEXT_KEPT_AFTER_CLOSE:-10m}
      THREADROUTE_CONV_MESSAGES_KEPT: ${THREADROUTE_CONV_MESSAGES_KEPT:-50}
      THREADROUTE_CONV_SESSION_RECORD_KEPT: ${THREADROUTE_CONV_SESSION_RECORD_KEPT:-24h}
      THREADROUTE_CONV_EARLY_DELETION_KEPT: ${THREADROUTE_CONV_EARLY_DELETION_KEPT:-10m}
      THREADROUTE_CONV_APPLIED_LIFETIME: ${THREADROUTE_CONV_APPLIED_LIFETIME:-7h}
      THREADROUTE_CONV_KEY_MARGIN: ${THREADROUTE_CONV_KEY_MARGIN:-7h}
    ports:
      - "127.0.0.1:9467:9467"
    # A normal batch takes milliseconds. If conv is killed in the middle of
    # one, its offsets are not committed and the outbox stays in Redis, so
    # the next start publishes it and redelivered records change nothing.
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 256m

  router:
    <<: *go-service
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        CMD: router
    image: threadroute-router:dev
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      THREADROUTE_KAFKA_BROKERS: kafka:9092
      THREADROUTE_LOG_LEVEL: ${THREADROUTE_LOG_LEVEL:-info}
      # The password is part of the DSN; the DSN is never logged.
      THREADROUTE_POSTGRES_DSN: postgres://threadroute:${THREADROUTE_POSTGRES_PASSWORD:-threadroute-local-only}@postgres:5432/threadroute?sslmode=disable
      THREADROUTE_POSTGRES_MAX_CONNS: ${THREADROUTE_POSTGRES_MAX_CONNS:-8}
      THREADROUTE_POSTGRES_CONNECT_WAIT: ${THREADROUTE_POSTGRES_CONNECT_WAIT:-1m}
      THREADROUTE_ROUTER_GROUP_ID: ${THREADROUTE_ROUTER_GROUP_ID:-threadroute-router}
      THREADROUTE_ROUTER_METRICS_ADDR: ":9468"
      # All interfaces inside the container, so sim reaches it. The API has
      # no authentication in stage 3: the host port below is on 127.0.0.1
      # only, and the compose network is not reachable from outside.
      THREADROUTE_ROUTER_API_ADDR: ":9470"
      THREADROUTE_ROUTER_INPUT_TOPIC_WAIT: ${THREADROUTE_ROUTER_INPUT_TOPIC_WAIT:-2m}
      THREADROUTE_ROUTER_SPEED_FACTOR: ${THREADROUTE_ROUTER_SPEED_FACTOR:-1}
      THREADROUTE_ROUTER_OPERATOR_CAPACITY: ${THREADROUTE_ROUTER_OPERATOR_CAPACITY:-4}
      THREADROUTE_ROUTER_ACCEPT_TIMEOUT: ${THREADROUTE_ROUTER_ACCEPT_TIMEOUT:-20s}
      THREADROUTE_ROUTER_ASSIGNMENT_TARGET: ${THREADROUTE_ROUTER_ASSIGNMENT_TARGET:-60s}
      THREADROUTE_ROUTER_FIRST_RESPONSE_TARGET: ${THREADROUTE_ROUTER_FIRST_RESPONSE_TARGET:-120s}
      THREADROUTE_ROUTER_TEAM_FORM_LOAD: ${THREADROUTE_ROUTER_TEAM_FORM_LOAD:-20}
      THREADROUTE_ROUTER_TEAM_RELEASE_LOAD: ${THREADROUTE_ROUTER_TEAM_RELEASE_LOAD:-8}
      THREADROUTE_ROUTER_TEAM_RELEASE_AFTER: ${THREADROUTE_ROUTER_TEAM_RELEASE_AFTER:-15m}
      THREADROUTE_ROUTER_TEAM_MIN_SIZE: ${THREADROUTE_ROUTER_TEAM_MIN_SIZE:-2}
      THREADROUTE_ROUTER_TEAM_MAX_SIZE: ${THREADROUTE_ROUTER_TEAM_MAX_SIZE:-20}
      THREADROUTE_ROUTER_ASSIGN_WORKERS: ${THREADROUTE_ROUTER_ASSIGN_WORKERS:-4}
      THREADROUTE_ROUTER_ASSIGN_INTERVAL: ${THREADROUTE_ROUTER_ASSIGN_INTERVAL:-250ms}
      THREADROUTE_ROUTER_EXPIRE_INTERVAL: ${THREADROUTE_ROUTER_EXPIRE_INTERVAL:-1s}
      THREADROUTE_ROUTER_SLA_INTERVAL: ${THREADROUTE_ROUTER_SLA_INTERVAL:-1s}
      THREADROUTE_ROUTER_TEAM_INTERVAL: ${THREADROUTE_ROUTER_TEAM_INTERVAL:-10s}
      THREADROUTE_ROUTER_PUBLISH_INTERVAL: ${THREADROUTE_ROUTER_PUBLISH_INTERVAL:-100ms}
      THREADROUTE_ROUTER_PUBLISH_BATCH: ${THREADROUTE_ROUTER_PUBLISH_BATCH:-500}
      THREADROUTE_ROUTER_OUTBOX_KEEP: ${THREADROUTE_ROUTER_OUTBOX_KEEP:-1h}
      THREADROUTE_ROUTER_PRUNE_INTERVAL: ${THREADROUTE_ROUTER_PRUNE_INTERVAL:-1m}
      THREADROUTE_ROUTER_COUNTS_INTERVAL: ${THREADROUTE_ROUTER_COUNTS_INTERVAL:-5s}
      THREADROUTE_ROUTER_OUTAGE_LIMIT: ${THREADROUTE_ROUTER_OUTAGE_LIMIT:-2m}
    ports:
      - "127.0.0.1:9468:9468"
      - "127.0.0.1:9470:9470"
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 256m

  sim:
    <<: *go-service
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        CMD: sim
    image: threadroute-sim:dev
    # The router image has no shell for a healthcheck, so sim only starts
    # after it; sim itself waits for the operator API and the routing topic
    # (THREADROUTE_SIM_START_WAIT). The dependency also makes compose stop
    # sim before the router, so sim can put its operators offline.
    depends_on:
      kafka:
        condition: service_healthy
      router:
        condition: service_started
    environment:
      THREADROUTE_KAFKA_BROKERS: kafka:9092
      THREADROUTE_LOG_LEVEL: ${THREADROUTE_LOG_LEVEL:-info}
      THREADROUTE_SIM_ROUTER_URL: http://router:9470
      THREADROUTE_SIM_START_WAIT: ${THREADROUTE_SIM_START_WAIT:-2m}
      THREADROUTE_SIM_GROUP_ID: ${THREADROUTE_SIM_GROUP_ID:-threadroute-sim}
      THREADROUTE_SIM_METRICS_ADDR: ":9469"
      THREADROUTE_SIM_OUTAGE_LIMIT: ${THREADROUTE_SIM_OUTAGE_LIMIT:-2m}
      THREADROUTE_SIM_OPERATORS: ${THREADROUTE_SIM_OPERATORS:-200}
      THREADROUTE_SIM_LANGUAGES: ${THREADROUTE_SIM_LANGUAGES:-en:176,ja:6,de:4,fr:4,es:4,pt:3,ko:3}
      THREADROUTE_SIM_CAPACITY: ${THREADROUTE_SIM_CAPACITY:-0}
      THREADROUTE_SIM_SHIFT_ONLINE: ${THREADROUTE_SIM_SHIFT_ONLINE:-4h}
      THREADROUTE_SIM_SHIFT_OFFLINE: ${THREADROUTE_SIM_SHIFT_OFFLINE:-30m}
      THREADROUTE_SIM_ACCEPT_DELAY_MIN: ${THREADROUTE_SIM_ACCEPT_DELAY_MIN:-1s}
      THREADROUTE_SIM_ACCEPT_DELAY_MAX: ${THREADROUTE_SIM_ACCEPT_DELAY_MAX:-8s}
      THREADROUTE_SIM_MISSED_OFFER_SHARE: ${THREADROUTE_SIM_MISSED_OFFER_SHARE:-0.03}
      THREADROUTE_SIM_HANDLING_MEDIAN: ${THREADROUTE_SIM_HANDLING_MEDIAN:-45s}
      THREADROUTE_SIM_RESOLVE_MEDIAN: ${THREADROUTE_SIM_RESOLVE_MEDIAN:-3m}
      THREADROUTE_SIM_SEED: ${THREADROUTE_SIM_SEED:-1}
    ports:
      - "127.0.0.1:9469:9469"
    # On stop sim puts its operators offline (up to 10s), then closes its
    # Kafka client (up to 10s).
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 256m

  record:
    <<: *go-service
    profiles: ["record"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        CMD: record
    image: threadroute-record:dev
    environment:
      THREADROUTE_KAFKA_BROKERS: kafka:9092
      THREADROUTE_LOG_LEVEL: ${THREADROUTE_LOG_LEVEL:-info}
      THREADROUTE_RECORD_GROUP_ID: ${THREADROUTE_RECORD_GROUP_ID:-threadroute-record}
      THREADROUTE_RECORD_START: ${THREADROUTE_RECORD_START:-end}
      # The path inside the container. It has no .git above it, so the
      # recorder's git working tree check passes.
      THREADROUTE_RECORD_DIR: /recordings
      THREADROUTE_RECORD_SEGMENT_MAX_BYTES: ${THREADROUTE_RECORD_SEGMENT_MAX_BYTES:-268435456}
      THREADROUTE_RECORD_SEGMENT_MAX_AGE: ${THREADROUTE_RECORD_SEGMENT_MAX_AGE:-1h}
      THREADROUTE_RECORD_RETENTION: ${THREADROUTE_RECORD_RETENTION:-336h}
      THREADROUTE_RECORD_MAX_TOTAL_BYTES: ${THREADROUTE_RECORD_MAX_TOTAL_BYTES:-}
      THREADROUTE_RECORD_METRICS_ADDR: ":9465"
    volumes:
      # Recordings hold real post text and author IDs. They live on the
      # host, outside the repository (decision 0004).
      - type: bind
        source: ${THREADROUTE_RECORD_HOST_DIR:-${HOME}/threadroute-recordings}
        target: /recordings
        bind:
          create_host_path: true
    ports:
      - "127.0.0.1:9465:9465"
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 256m

volumes:
  kafka-data:
  redis-data:
  postgres-data:
