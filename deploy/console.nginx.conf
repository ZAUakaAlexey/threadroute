# Server of the console image (deploy/console.Dockerfile): the static build
# of web/, and the two paths of the gateway on the same origin, so the
# browser talks to one address (decision 0013).
#
# This file is included inside the http block of the nginx.conf of the
# unprivileged nginx image. That image runs as a non-root user, keeps its
# pid file and temporary files in /tmp, and listens on 8080.

# The address of the gateway is looked up again every 10 seconds through
# the DNS server of Docker, so a recreated gateway container with a new
# address is found without a restart of nginx.
resolver 127.0.0.11 valid=10s ipv6=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

# The public snapshot is the same for every visitor. The gateway rebuilds
# it every second, so nginx keeps it for one second (decision 0013).
proxy_cache_path /tmp/snapshot-cache levels=1 keys_zone=snapshot:1m max_size=8m inactive=1m use_temp_path=off;

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    charset utf-8;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;

    set $gateway http://gateway:9472;

    # nginx drops the add_header lines of the server block in a location
    # that has its own add_header, so every location includes the security
    # headers itself.
    include /etc/nginx/snippets/security-headers.conf;

    # The page itself: never from a cache, so a new build is seen at once.
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    location = / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }

    # Vite puts a content hash into every file name under assets/.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /v1/public/snapshot {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass $gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache snapshot;
        proxy_cache_valid 200 1s;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 2s;
        proxy_cache_use_stale updating;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    # The WebSocket. The gateway takes the right-most X-Forwarded-For entry
    # as the client address (THREADROUTE_GATEWAY_TRUST_PROXY=true). nginx
    # sets it to the address it sees, never to a value the client sent.
    location = /v1/ws {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass $gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_connect_timeout 2s;
        # The gateway pings every 20 seconds, so a healthy connection is
        # never idle this long.
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Nothing else of the gateway is reachable through the console.
    location /v1/ {
        return 404;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }
}
