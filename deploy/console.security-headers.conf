# Security headers of every answer of the console (deploy/console.nginx.conf).
#
# The policy allows scripts, styles, fonts, images and connections from the
# page's own origin only. connect-src 'self' also covers the WebSocket on
# the same host and port. One exception: style-src-elem allows inline
# <style> elements, because the dialog of the console (Radix) adds one to
# lock the page scroll, with values computed at run time, so no hash fits.
# Inline style attributes and inline scripts stay blocked.
add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; style-src-elem 'self' 'unsafe-inline'; font-src 'self'; img-src 'self'; connect-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
