# sqlc configuration. Run `make generate` from the repository root, which
# runs the sqlc version pinned in the Makefile. The schema is read from the
# goose migrations, so there is one source for the tables.
version: "2"
sql:
  - engine: postgresql
    schema: migrations
    queries: queries
    gen:
      go:
        package: pgdb
        out: pgdb
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        emit_empty_slices: true
        overrides:
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              import: time
              type: Time
              pointer: true
